      - name: environment_id
        in: query
        schema:
          $ref: '#/components/schemas/api.params.predicate.filter.string'
      - name: environment_kind
        in: query
        schema:
          $ref: '#/components/schemas/api.params.predicate.filter.string'
      - name: name
        in: query
