aid: specterops
name: SpecterOps
description: 'SpecterOps is a cybersecurity company specializing in identity attack path management and
  offensive security. Its flagship BloodHound platform continuously maps identity relationships and permissions
  across Active Directory, Entra ID, and cloud/SaaS environments to reveal and eliminate hidden attack
  paths before they are exploited. Offerings include BloodHound Enterprise (SaaS), BloodHound Community
  Edition (open source), OpenGraph for custom data sources, Privilege Zones, and the SharpHound/AzureHound
  collectors, alongside adversary-focused services (red team, penetration testing, attack path assessments)
  and training. The BloodHound API is a documented REST API (OpenAPI 3.0.3, v2) covering 270+ operations
  for data ingest, Cypher graph queries, analysis, attack-path findings, and administration.'
